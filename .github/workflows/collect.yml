name: 定期取得

on:
  schedule:
    # 毎日 06:10 JST（UTC 21:10）。UTC指定なので前日の時刻になる。
    - cron: "10 21 * * *"
  workflow_dispatch: {}   # 手動でも実行できるようにしておく

# 生成物をコミットするので書き込み権限が要る。
# 失敗時にIssueを立てるので issues も要る。
permissions:
  contents: write
  issues: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: データを取得して蓄積
        run: python scripts/collect.py

      - name: 変更があればコミット
        run: |
          if [ -z "$(git status --porcelain docs/)" ]; then
            echo "変更なし。コミットをスキップします。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "auto: 定期取得 $(date -u +'%Y-%m-%d') [skip ci]"
          git push

      # ここがこのデモの主眼。
      # 失敗を人間が見に行かないと気づけない状態にしない。
      - name: 失敗したらIssueで通知
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `定期取得が失敗しました (${new Date().toISOString().slice(0, 10)})`;
            const body = [
              '定期実行に失敗しました。',
              '',
              `- 実行ログ: ${runUrl}`,
              `- ワークフロー: \`${context.workflow}\``,
              '',
              '### 確認する順番',
              '1. 取得元が仕様変更していないか（`[構造の変化を検出]` がログに出ていれば該当）',
              '2. 取得元が一時的に落ちていないか（時間をおいて手動実行で切り分け）',
              '3. それ以外のエラーはログ本文を確認',
              '',
              '手動実行: Actions タブ → 「定期取得」 → Run workflow',
            ].join('\n');

            // 同じ内容のIssueを毎日作らない
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'sync-error',
            });
            if (open.data.some(i => i.title === title)) {
              core.info('同じIssueが既に開いています。作成をスキップします。');
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['sync-error'],
            });
